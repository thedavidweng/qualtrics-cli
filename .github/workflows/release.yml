name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: thedavidweng/cli-workflow-template/.github/workflows/go-release.yml@87904abb6c0938e078a439474aebfba9b571a55e # main
    with:
      enable-homebrew-verify: false
    secrets: inherit
