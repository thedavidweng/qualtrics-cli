# .goreleaser.yaml
version: 2
project_name: qualtrics

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    main: ./cmd/qualtrics
    binary: qualtrics
    ldflags:
      - -s -w
      - -X github.com/thedavidweng/qualtrics-cli/internal/version.Version={{.Version}}
      - -X github.com/thedavidweng/qualtrics-cli/internal/version.Commit={{.Commit}}
      - -X github.com/thedavidweng/qualtrics-cli/internal/version.Date={{.Date}}
      - -X github.com/thedavidweng/qualtrics-cli/internal/version.BuiltBy=goreleaser

universal_binaries:
  - replace: true

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64"}}x86_64
      {{- else if eq .Arch "all"}}universal
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: qualtrics
    binaries:
      - qualtrics
    generate_completions_from_executable:
      executable: "qualtrics"
      args:
        - completion
      shell_parameter_format: cobra
      shells:
        - bash
        - zsh
        - fish
    repository:
      owner: thedavidweng
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/thedavidweng/qualtrics-cli"
    description: "Agent-friendly CLI for the Qualtrics Experience Management Platform & offline survey compiler"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/qualtrics"]
          end

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch
